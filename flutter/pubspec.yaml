name: notes_app
description: "Notes + habit tracker — Flutter port of the Next.js source app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

# flutter_secure_storage is pinned to the 10.x line: 11.0.0 hardcodes
# `compileSdk = 37` in its own android/build.gradle, and this machine's
# Android SDK only ships versioned "android-37.x" platforms, not the plain
# "android-37" AGP looks for — a real toolchain gap, not a project bug.
# Revisit once either the SDK or the plugin catches up.
dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.3.1 # pinned below 11.x — see note below
  flutter_staggered_grid_view: ^0.7.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Satoshi is self-hosted in the source app but only as .woff2, which
  # Flutter can't load — see the "Known blocker" note in
  # lib/core/theme/app_text_theme.dart. Once .otf/.ttf files are available
  # under assets/fonts/, register them here:
  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-400.otf
  #         weight: 400
  #       - asset: assets/fonts/Satoshi-500.otf
  #         weight: 500
  #       - asset: assets/fonts/Satoshi-700.otf
  #         weight: 700
